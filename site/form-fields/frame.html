    <script>
      (() => {
        const MODES = ["sidebar","collapsed-right"];
        const FIELDS = [{"id":"name-empty","label":"Name, empty"},{"id":"name-full-name-error","label":"Name, full name required"},{"id":"email-empty","label":"Email, empty"},{"id":"email-filled","label":"Email, valid"},{"id":"email-invalid","label":"Email, invalid"},{"id":"email-personal","label":"Email, business domain required"},{"id":"email-submit-error","label":"Email, submit failed"},{"id":"company-filled","label":"Company, filled"},{"id":"phone-invalid","label":"Phone, invalid"},{"id":"decimal-filled","label":"Number, filled"},{"id":"string-placeholder","label":"Short answer, custom placeholder"},{"id":"text-filled","label":"Long answer, filled"},{"id":"picklist-empty","label":"Picklist, nothing picked"},{"id":"picklist-stacked","label":"Picklist, stacked"},{"id":"picklist-stacked-expanded","label":"Picklist, stacked full width"},{"id":"multi-picklist-empty","label":"Multi-picklist, nothing picked"},{"id":"multi-picklist-picked","label":"Multi-picklist, two picked"},{"id":"boolean-unchecked","label":"Checkbox, unchecked"},{"id":"boolean-checked","label":"Checkbox, checked"}];
        const ANCHORED = ["sidebar--multi-picklist-empty","sidebar--multi-picklist-picked","sidebar--picklist-empty","sidebar--picklist-stacked","sidebar--picklist-stacked-expanded"];
        const THEMES = {"default":{"--q-primary-color":"#437D88","--q-lighter-primary-color":"#b4cbcf","--q-text-color":"#ffffff","--q-button-background-color":"transparent","--q-button-hover-background-color":"#437D8810","--q-button-background-layer":"#ffffff","--q-button-hover-background-layer":"#ffffff","--q-button-text-color":"#437D88","--q-button-hover-text-color":"#437D88","--q-button-border-color":"#437D88","--q-button-hover-border-color":"#437D88","--q-button-border-radius":"4px","--q-control-border-radius":"4px"},"solid":{"--q-primary-color":"#437D88","--q-lighter-primary-color":"#b4cbcf","--q-text-color":"#ffffff","--q-button-background-color":"#437D88","--q-button-hover-background-color":"#396a74","--q-button-background-layer":"#437D88","--q-button-hover-background-layer":"#396a74","--q-button-text-color":"#ffffff","--q-button-hover-text-color":"#ffffff","--q-button-border-color":"#437D88","--q-button-hover-border-color":"#396a74","--q-button-border-radius":"4px","--q-control-border-radius":"4px"},"shade":{"--q-primary-color":"#437D88","--q-lighter-primary-color":"#b4cbcf","--q-text-color":"#ffffff","--q-button-background-color":"#437D8820","--q-button-hover-background-color":"#437D8840","--q-button-background-layer":"#ffffff","--q-button-hover-background-layer":"#ffffff","--q-button-text-color":"#437D88","--q-button-hover-text-color":"#437D88","--q-button-border-color":"transparent","--q-button-hover-border-color":"transparent","--q-button-border-radius":"4px","--q-control-border-radius":"4px"},"none":{}};
        const params = new URLSearchParams(location.search);
        const mode = MODES.includes(params.get("mode")) ? params.get("mode") : MODES[0];
        const theme = params.get("theme") in THEMES ? params.get("theme") : Object.keys(THEMES)[0];
        // ?field= limits the frame to one or more states (comma-separated); unset shows all.
        const only = (params.get("field") || "").split(",").filter(Boolean);
        const shown = only.length ? FIELDS.filter((f) => only.includes(f.id)) : FIELDS;
        if (!HTMLElement.prototype.attachShadow) {
          document.body.textContent = "This browser has no shadow DOM.";
          return;
        }
        document.body.dataset.mode = mode;
        document.getElementById("states").replaceChildren(
          ...shown.map((field) => {
            const section = document.createElement("section");
            section.className = "state";
            section.id = field.id;
            const label = document.createElement("p");
            label.className = "state__label";
            const anchored = ANCHORED.includes(mode + "--" + field.id);
            if (anchored) section.dataset.anchored = "";
            label.textContent = anchored ? field.label + " (in the timeline)" : field.label;
            const host = document.createElement("div");
            host.className = "state__host";
            host.dataset.state = field.id;
            // The theme, as Piper sets it: custom properties on the host, inherited into the shadow root.
            for (const [name, value] of Object.entries(THEMES[theme] || {})) host.style.setProperty(name, value);
            const root = host.attachShadow({ mode: "open", delegatesFocus: true });
            const sheet = document.createElement("link");
            sheet.rel = "stylesheet";
            sheet.href = "panda.css";
            // Insert the markup once the stylesheet has loaded, as in production, where the
            // widget's CSS is in place before a field renders. Inserted first, rules like the
            // multi-picklist's "transition: all" animate from browser defaults to the real styles.
            const content = document.getElementById("state-" + mode + "--" + field.id).content.cloneNode(true);
            const insert = () => root.append(content);
            sheet.addEventListener("load", insert, { once: true });
            sheet.addEventListener("error", insert, { once: true });
            root.append(sheet);
            // Nothing is wired to the form: keep a submit from reloading the frame.
            root.addEventListener("submit", (event) => event.preventDefault());
            section.append(label, host);
            return section;
          }),
        );
      })();
